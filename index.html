<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Comisiones BBVA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Calculadora de Cobros BBVA</h1>
            <p>Calcula cuánto cobrar para recibir el monto exacto deseado.</p>
        </header>

        <section class="calculator">
            <div class="input-group">
                <label for="amount">Monto a recibir ($)</label>
                <input type="number" id="amount" placeholder="0.00" value="100.00" step="0.01">
            </div>

            <div class="results-grid" id="results">
                <!-- Cards will be injected here by JS -->
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
